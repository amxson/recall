[workspace]
resolver = "2"
members = [
    "crates/recall-core",
    "crates/recall-cli",
    "crates/recall-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/amxson/recall"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
