<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recall</title>
    <link rel="stylesheet" href="/src/popup/popup.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="dot" aria-hidden="true"></span>
          <span class="name">Recall</span>
          <span id="stats-pill" class="stats-pill">0 pages</span>
        </div>
        <button id="save-btn" type="button" class="btn-save">Save this page</button>
      </header>

      <div id="status-bar" class="status-bar hidden" role="status" aria-live="polite"></div>

      <nav class="tabs" role="tablist">
        <button id="tab-search" type="button" class="tab active" role="tab" aria-selected="true">
          Search
        </button>
        <button id="tab-saved" type="button" class="tab" role="tab" aria-selected="false">
          Saved pages
        </button>
      </nav>

      <section id="panel-search" class="panel">
        <div class="search-row">
          <input
            id="search-input"
            type="search"
            placeholder="Search from memory (e.g. run email after response)…"
            autocomplete="off"
            autofocus
          />
        </div>

        <div class="controls-row">
          <div class="mode-group" role="group" aria-label="Search mode">
            <button type="button" class="mode-btn active" data-mode="hybrid">Hybrid</button>
            <button type="button" class="mode-btn" data-mode="keyword">Keyword</button>
            <button type="button" class="mode-btn" data-mode="semantic">Semantic</button>
          </div>
          <span id="latency-readout" class="latency"></span>
        </div>

        <div id="results-list" class="results-list">
          <p class="empty">
            Save documentation pages or articles, then search them here by exact term or rough idea.
          </p>
        </div>
      </section>

      <section id="panel-saved" class="panel hidden">
        <div id="docs-list" class="docs-list">
          <p class="empty">No pages saved yet.</p>
        </div>
      </section>
    </div>

    <script type="module" src="/src/popup/popup.ts"></script>
  </body>
</html>
